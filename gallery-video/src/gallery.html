<div class="gp" data-gp aria-label="갤러리에서 사진을 직접 찾는 화면">

    <div class="gp__scr">

          <svg width="24" height="12" viewBox="0 0 24 12"><rect x="0" y="0" width="21" height="12" rx="3.6"/><rect x="22" y="3.6" width="2" height="4.8" rx="1"/></svg>

      <!-- 사진 탭 -->
      <div class="gp__view gp__photos">
        <div class="gp__top">
          <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.500 15.500 5 5"/></svg>
          <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r=".9"/><circle cx="12" cy="12" r=".9"/><circle cx="12" cy="19" r=".9"/></svg>

        <div class="gp__list" data-gp-list></div>

          <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>

      <!-- 검색 -->
      <div class="gp__view gp__search" data-gp-search>
        <div class="gp__sbar">
          <span class="gp__back"><svg viewBox="0 0 24 24"><path d="m14.500 5-7 7 7 7"/></svg></span>
          <div class="gp__field">
            <span class="gp__q" data-gp-q></span><i class="gp__caret" data-gp-caret></i>
            <span class="gp__clear" data-gp-clear><svg viewBox="0 0 10 10"><path d="m2 2 6 6M8 2 2 8"/></svg></span>
          </div>
        </div>
        <div class="gp__recent" data-gp-recent>
          <p>최근 검색</p>

            <li><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.500"/><path d="M12 7.500V12l3 2"/></svg>제주도 바다</li>
            <li><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.500"/><path d="M12 7.500V12l3 2"/></svg>강아지</li>
            <li><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.500"/><path d="M12 7.500V12l3 2"/></svg>영수증</li>

        <div class="gp__none" data-gp-none>
          <svg viewBox="0 0 52 52"><circle cx="23" cy="23" r="14"/><path d="m33.500 33.500 11 11"/></svg>

        </div>
        <div class="gp__kb" data-gp-kb></div>

      <div class="gp__view gp__viewer">
        <div class="gp__vbg" data-gp-vbg></div>
        <div class="gp__vimg" data-gp-vimg></div>
        <div class="gp__vui" data-gp-vui>
          <div class="gp__vbar">
            <span class="gp__back"><svg viewBox="0 0 24 24"><path d="m14.500 5-7 7 7 7"/></svg></span>
            <div>2024년 3월 16일<span>오후 2:14</span></div>

          <div class="gp__vtools">

            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.500"/><path d="M12 11v5.500M12 7.800v.2"/></svg>
            <svg viewBox="0 0 24 24"><circle cx="6.500" cy="12" r="2.300"/><circle cx="17" cy="6" r="2.300"/><circle cx="17" cy="18" r="2.300"/><path d="m8.600 11 6.300-3.800M8.600 13l6.300 3.800"/></svg>
            <svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/></svg>
          </div>
        </div>

      <i class="gp__touch" data-gp-touch></i>
