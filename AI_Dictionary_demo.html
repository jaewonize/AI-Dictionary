@keyframes hop{0%,62%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-5px);opacity:1}}
.step .d{font-size:14.5px;font-weight:500;color:#8B84A8;line-height:1.55;margin-top:5px}

.step .d i{font-style:normal;color:#C4BED6;font-weight:600;margin-right:1px}
.answer{border:1px solid #DCD2FA;background:#F8F6FF;border-radius:13px;padding:13px 15px;margin-bottom:11px}
.answer .lbl{font-size:11.5px;font-weight:800;color:#9A8FC4;letter-spacing:.03em}
.answer .val{font-size:24px;font-weight:800;color:#17151F;letter-spacing:-.035em;line-height:1.25;margin-top:4px}
.answer .sub{font-size:12px;font-weight:600;color:#6C6680;line-height:1.5;margin-top:5px}

.rv{opacity:0;transform:translateY(4px);transition:opacity .3s,transform .3s}
.rv.on{opacity:1;transform:none}

.stores{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 14px}
.srow{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:#8B84A8}

.srow.on .ck{background:#17151F;border-color:#17151F}
.srow.on .ck::after{content:"";position:absolute;left:50%;top:50%;width:3px;height:5px;border:solid #fff;border-width:0 1.5px 1.5px 0;transform:translate(-50%,-70%) rotate(45deg)}

.narrow{margin-top:5px;display:flex;align-items:baseline;gap:5px;font-size:14px;font-weight:600;color:#8B84A8}

.doc .why{font-size:10.5px;font-weight:600;color:#6C6680;line-height:1.45;margin-top:3px}

.doc .src{font-size:9.5px;font-weight:700;color:#B5AEC8;margin-top:4px;display:flex;gap:6px}

.ibox input{flex:1;min-width:0;border:0;background:none;outline:none;font-family:inherit;font-size:13.5px;font-weight:600;color:#17151F;letter-spacing:-.02em;padding:6px 0}

.fade{opacity:0;transform:translateY(7px);animation:fade .42s cubic-bezier(.25,.8,.3,1) forwards}

@media(max-width:820px){

     why:"이전 버전 · 같은 4쪽이지만 <b>핵심 메시지와 실행 일정이 다름</b>", thumb:"08_brand_documents/브랜드전략_제안_v6.png"},
    {ext:"pdf", file:"브랜드전략_제안.pdf", store:"메일함", date:"2026.09.24 09:12",
     why:"대조용 PDF 사본 · 삭제된 메일의 첨부파일", thumb:"08_brand_documents/브랜드전략_제안.png"}
  ],
  follow:["v7만 열기","v6와 달라진 점"]
},
{
  q:"어제 회의 자료 표지에 쓴 제목 폰트와 이미지", layout:"grid", core:"자료 안에 쓴 것을 꺼낸다",
  steps:[
    {type:"cond", t:"찾을 내용을 정리했어요",
     tags:[["자료","어제 회의 자료"],["찾을 것","표지 제목 폰트 · 이미지"]]},
    {type:"stores", t:"문서가 있는 곳을 찾아봤어요", rows:STORES_DOC},
    {type:"note", t:"어제 만든 자료는 하나였어요",
     d:"<b>2026.10.18</b> 주거 경험 기획 회의 · 2027_주거경험_트렌드.pptx"},
    {type:"note", t:"파일 안을 열어봤어요", hop:true, wait:1600,
     d:"표지 슬라이드에서 <b>글꼴 지정과 이미지</b>를 꺼냈어요"}
  ],
  answer:{label:"표지 제목 폰트", value:"Noto Sans KR", sub:"45pt · 문서 기본 글꼴은 Aptos인데 표지 제목만 따로 지정했어요"},
  results:[
    {file:"IMG_013402.png", store:"파일", date:"2026.10.18", why:"표지에 깔린 이미지 · 1672×941",
     src:"09_interior_trend_documents/IMG_013402.png"}
  ],
  follow:["이 자료 어떤 내용이야","같은 글꼴 쓴 자료 더 보기"]
}
];


/* 견적서는 기본적으로 최신 날짜부터 제공한다. */
SCENARIOS.find(s=>s.q==="견적 금액 500만 원 넘는 견적서").results.sort((a,b)=>b.date.localeCompare(a.date));

const U = path => encodeURI(path);   /* 한글 · 공백이 든 실제 파일 경로 */
const ICON_PHOTO = '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#6D4FE0" stroke-width="1.6" opacity=".3"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="m3 16.5 4.5-4 4 3.5 4-5 4.5 5.5"/></svg>';

const chat=document.getElementById('chat'), inp=document.getElementById('inp'),
      send=document.getElementById('send'), qpick=document.getElementById('qpick');
window.name='aidict-demo';                  /* 제안서에서 이 탭을 다시 쓰도록 이름을 붙인다 */
let timers=[], busy=false;

const wait=(ms,fn)=>timers.push(setTimeout(fn,ms));
const add=html=>{const d=document.createElement('div');d.className='fade';d.innerHTML=html;
                 chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d;};

/* 왼쪽 패널 — 제안서 05장 질의 8개 (폰 밖 데모 조작부) */
qpick.innerHTML=SCENARIOS.map((s,i)=>
  '<button data-i="'+i+'"><span class="n">'+(i+1)+'</span><span class="q">'+s.q+'</span>'
  +(s.attach?'<span class="att">사진 첨부</span>':'')
  +'<span class="core">'+s.core+'</span></button>').join('');
qpick.querySelectorAll('button').forEach(b=>b.onclick=()=>{
  reset();
  qpick.querySelectorAll('button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  typeQuery(SCENARIOS[+b.dataset.i].q);
});

function reset(){
  SCENARIOS.forEach(s=>delete s.usedFollow);
  activeScenario=null;
  timers.forEach(clearTimeout); timers=[]; busy=false;
  inp.value=''; inp.readOnly=false; inp.disabled=false; send.disabled=false;
  chat.innerHTML='<div class="empty">'
    +'<svg class="mark" viewBox="0 0 48 48" fill="none">'            /* 펼친 사전 + 돋보기 */
    +'<g stroke="#6D4FE0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity=".5">'
    +'<path d="M5 12c5.5-3 11.5-3 19 1v23c-7.5-4-13.5-4-19-1V12z"/>'
    +'<path d="M43 12c-5.5-3-11.5-3-19 1v23c7.5-4 13.5-4 19-1V12z"/></g>'
    +'<g stroke="#fff" stroke-width="6.5" stroke-linecap="round">'
    +'<circle cx="31" cy="30" r="8.5"/><path d="M37.2 36.2 43 42"/></g>'
    +'<g stroke="#6D4FE0" stroke-width="2.6" stroke-linecap="round">'
    +'<circle cx="31" cy="30" r="8.5"/><path d="M37.2 36.2 43 42"/></g></svg>'
    +'<h2>기억나는 대로 말해보세요</h2><p>알아서 찾아드려요</p></div>';
  qpick.querySelectorAll('button').forEach(x=>x.classList.remove('on'));
}

function typeQuery(q){
  inp.value=''; inp.readOnly=true; send.disabled=true;
  inp.focus();
  let i=0;
  (function tick(){
    if(i<=q.length){
      inp.value=q.slice(0,i++);
      inp.scrollLeft=inp.scrollWidth;
      wait(45,tick);
    } else wait(900,()=>{inp.readOnly=false; run();});
  })();
}

function run(){
  const q=inp.value.trim(); if(!q||busy||inp.readOnly) return;
  if(activeScenario && [...availableFollow(activeScenario),...(activeScenario.origin?['이전 결과로 돌아가기']:[])].includes(q)){
    inp.value='';
    const latest=chat.querySelector('[data-results="current"]');
    if(latest){
      const chip=[...latest.querySelectorAll('[data-follow]')].find(button=>button.dataset.follow===q);
      if(chip)chip.click();
      else applyFollow(activeScenario,q,latest);
    }
    return;
  }
  const exact=SCENARIOS.find(s=>s.q===q);
  const keywords=[['카페','바다'],['신발'],['견적'],['회의','자료'],['디올'],['와인'],['합격','파티'],['PDF','PPT']];
  const S=exact||SCENARIOS.find((s,i)=>keywords[i].every(word=>q.toLowerCase().includes(word.toLowerCase())));
  if(!S){
    add('<div class="me"><div class="b">'+h(q)+'</div></div>');
    chat.querySelectorAll('[data-results="current"]').forEach(el=>el.removeAttribute('data-results'));
    results({q,layout:'grid',results:[],follow:[],notice:'이 검색어에 해당하는 준비된 결과가 없어요. 사진 속 장면이나 파일의 내용, 날짜를 함께 적어주시면 좋아요.'});
    inp.value=''; send.disabled=false;return;
  }
  busy=true; inp.disabled=true; send.disabled=true;
  chat.innerHTML=''; inp.value='';

  add('<div class="me"><div class="b">'+h(q)
    +(S.attach?'<div class="attimg">'+(S.attachSrc
        ? '<img src="'+U(S.attachSrc)+'" alt="">'
        : ICON_PHOTO.replace(/#6D4FE0/g,'#fff').replace('opacity=".3"','opacity=".85"').replace(/30"/g,'22"')+S.attach)+'</div>':'')
    +'</div></div>');

  wait(420, ()=>step(S,0,1));
}

/* 단계 하나를 그리고, 다음 단계까지 걸릴 시간을 반환 */
function step(S,i,no){
  chat.querySelectorAll('.dot.live').forEach(d=>d.classList.remove('live'));
  chat.querySelectorAll('.hop').forEach(h=>h.remove());   /* 검색이 끝나면 도트를 멈춘다 */
  if(i>=S.steps.length){ results(S); return; }
  const s=S.steps[i]; let inner='';

  if(s.type==='cond')
    inner='<div class="d rv">'+s.tags.map(t=>'<i>'+t[0]+'</i> '+(t[2]?'<b>'+t[1]+'</b>':t[1])).join(' · ')+'</div>';
  else if(s.type==='stores')
    inner='<div class="stores">'+s.rows.map(r=>'<div class="srow rv"><span class="ck"></span><span>'+r[0]+'</span></div>').join('')+'</div>';
  else if(s.type==='narrow')
    inner='<div class="narrow rv"><span class="big">'+s.from+'</span><span>'+s.unit+'</span>'
      +'<span>→</span><span class="big hit">'+s.to+'</span><span>'+s.unit+'</span></div>';
  else if(s.type==='note') inner='<div class="d rv">'+s.d+'</div>';
  else if(s.type==='facts')
    inner='<div class="facts">'+s.facts.map(f=>'<div class="f rv"><i>'+f[0]+'</i><span>'+f[1]+'</span></div>').join('')+'</div>';
  else if(s.type==='ask')
    inner='<div class="d rv">'+s.d+'</div><div class="ask">'
      +s.opts.map((o,k)=>'<button class="rv" data-k="'+k+'">'+o[0]+'</button>').join('')+'</div>';

  const el=add('<div class="step"><div class="dot live"></div>'
    +'<div class="body"><div class="t">'+s.t
    +(s.hop?'<span class="hop"><i></i><i></i><i></i></span>':'')+'</div>'+inner+'</div></div>');

  /* 한 줄씩 차례로 띄워 처리 중인 느낌을 낸다 */
  const rows=[...el.querySelectorAll('.rv')];
  const lag=s.wait||0;                       /* 도트만 도는 구간 */
  rows.forEach((n,k)=>wait(lag+260+k*230,()=>{n.classList.add('on');chat.scrollTop=chat.scrollHeight;}));
  const dur=700+rows.length*230+lag;

  if(s.type==='ask'){                        /* 사용자가 고를 때까지 멈춤 */
    if(s.hop) wait(lag+260+rows.length*230,()=>el.querySelectorAll('.hop').forEach(h=>h.remove()));
    el.querySelectorAll('.ask button').forEach(b=>b.onclick=()=>{
      const o=s.opts[+b.dataset.k];
      el.querySelector('.ask').remove();
      el.querySelector('.d').innerHTML='선택: <b>'+o[0]+'</b>';
      add('<div class="me"><div class="b">'+o[0]+'</div></div>');
      /* 고른 선택지에 따라 이후 단계와 결과가 달라진다 */
      const N=o[2] ? Object.assign({},S,{steps:S.steps.slice(0,i+1).concat(o[2].steps),
                                         results:o[2].results, follow:o[2].follow||S.follow}) : S;
      wait(420,()=>step(N,i+1,no+1));
    });
    chat.scrollTop=chat.scrollHeight;
    return;
  }
  wait(dur,()=>step(S,i+1,no+1));
}

function results(S, grouped=false, existing=null){
  let body;
  if(S.layout==='grid'){
    const renderGrid=items=>'<div class="grid">'+items.map(r=>
      '<div class="card" role="button" tabindex="0" aria-label="'+h(r.file)+'" data-file="'+r.file+'"><div class="thumb">'
      +(r.src?'<img src="'+U(r.src)+'" alt="" loading="lazy" style="width:100%;height:100%;object-fit:cover">':ICON_PHOTO)
      +'<span class="badge">'+(r.inTrash?'휴지통 · ':'')+r.store+'</span></div></div>').join('')+'</div>';
    body=grouped && S.clusters
      ? '<div class="clusters">'+S.clusters.map(group=>{
          const items=S.results.filter(r=>r.date.slice(0,10)===group.date);
          return '<section class="result-cluster" aria-label="'+group.title+'">'
            +'<div class="cluster-head"><div><h3>'+group.title+'</h3><p>'+group.date+' · '+group.description+'</p></div>'
            +'<span class="cluster-count">'+items.length+'장</span></div>'+renderGrid(items)+'</section>';
        }).join('')+'</div>'
      : renderGrid(S.results);
  } else {
    body='<div class="list">'+S.results.map(r=>
      '<div class="doc" role="button" tabindex="0" aria-label="'+h(r.file)+'" data-file="'+r.file+'">'
      +(r.shot
        ? '<div class="pv"><img src="'+U(r.thumb)+'" alt="" loading="lazy"><span class="tag">'+r.ext.toUpperCase()+'</span></div>'
        : '<div class="ext '+r.ext+'">'+r.ext.toUpperCase()+'</div>')
      +'<div class="dm"><div class="fn">'+r.file+'</div><div class="why">'+r.why+'</div>'
      +'<div class="src"><span>'+(r.inTrash?'휴지통 · ':'')+r.store+'</span><span>'+r.date+'</span></div></div></div>').join('')+'</div>';
  }
  const answer=S.answer?'<div class="answer"><div class="lbl">'+h(S.answer.label)+'</div>'
    +'<div class="val">'+h(S.answer.value)+'</div><div class="sub">'+h(S.answer.sub)+'</div></div>':'';
  const html='<div data-results="current">'+answer+'<div class="reshead"><div class="t"><b>'+S.results.length+(S.layout==='grid'?'장':'건')+'</b> 찾았어요'
    +(grouped && S.clusters?' · '+S.clusters.length+'개 그룹':'')+'</div></div>'+(S.notice?'<div class="result-notice">'+h(S.notice)+'</div>':'')+body
    +'<div class="follow">'
    +(S.clusters?'<button data-action="group-results">'+(grouped?'한데 모아 보기':'이벤트별로 나눠 보기')+'</button>':'')
    +(S.origin?'<button data-follow="이전 결과로 돌아가기">이전 결과로 돌아가기</button>':'')
    +availableFollow(S).map(f=>'<button data-follow="'+h(f)+'">'+f+'</button>').join('')+'</div></div>';
  const result=existing || add(html);
  if(existing) result.innerHTML=html;
  const groupChip=result.querySelector('[data-action="group-results"]');
  if(groupChip) groupChip.onclick=()=>results(S,!grouped,result);
  activeScenario=S;
  result.querySelectorAll('[data-follow]').forEach(button=>button.onclick=()=>{
    if(busy) return;
    const label=button.dataset.follow;
    button.remove();
    applyFollow(S,label,result);
  });
  result.querySelectorAll('.card,.doc').forEach(card=>{
    const open=()=>{if(!busy)previewFile(S.results.find(r=>r.file===card.dataset.file));};
    card.onclick=open;
    card.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open();}};
  });
  inp.disabled=false; send.disabled=false; busy=false;
  if(existing){
    chat.scrollTop+=result.getBoundingClientRect().top-chat.getBoundingClientRect().top-24;
  } else chat.scrollTop=chat.scrollHeight;
}

inp.addEventListener('keydown',e=>{if(e.key==='Enter') run();});
reset();
</script>
</body>
</html>
