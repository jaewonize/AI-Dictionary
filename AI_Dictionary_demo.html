<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI ( ) Dictionary — 모바일</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Pretendard Variable',Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  background:#F4F2FA;color:#39354A;word-break:keep-all;-webkit-font-smoothing:antialiased;
  min-height:100vh;display:flex;align-items:center;justify-content:center;gap:64px;padding:40px 28px;flex-wrap:wrap}

.aside{width:600px;display:flex;flex-direction:column;gap:18px}
.aside .brand{font-size:20px;font-weight:800;letter-spacing:-.01em;color:#6D4FE0}
.qpick{display:flex;flex-direction:column;gap:9px}
.qpick button{font-family:inherit;text-align:left;display:flex;gap:13px;align-items:center;width:100%;
  background:#fff;border:1px solid #E7E4F2;border-radius:13px;padding:15px 18px;cursor:pointer;transition:.15s}
.qpick button:hover{background:#FBFAFE;border-color:#6D4FE0}
.qpick button.on{background:#F6F4FC;border-color:#6D4FE0}
.qpick .n{width:23px;height:23px;flex:none;border-radius:7px;background:#EFEAFE;color:#6D4FE0;
  font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
.qpick .q{font-size:18px;font-weight:700;color:#4A4460;letter-spacing:-.02em;line-height:1.35}
.qpick button:hover .q,.qpick button.on .q{color:#17151F}
.qpick .att{font-size:10.5px;font-weight:800;color:#159B79;background:#DEF7EF;padding:2px 5px;border-radius:4px;margin-left:-6px;flex:none}
.qpick .core{margin-left:auto;padding-left:16px;flex:none;font-size:13px;font-weight:700;color:#A79FBD;letter-spacing:-.01em}
.qpick button:hover .core,.qpick button.on .core{color:#6D4FE0}
.replay{display:inline-flex;align-items:center;gap:7px;align-self:flex-start;border:1px solid #DCD6EC;background:#fff;
  color:#5B5474;font-family:inherit;font-size:14px;font-weight:700;padding:11px 18px;border-radius:999px;cursor:pointer;transition:.18s}
.replay:hover{background:#F6F4FC;border-color:#6D4FE0;color:#17151F}
.acts{display:flex;gap:8px;flex-wrap:wrap}
a.replay{text-decoration:none}

/* ══ 폰 360x780 ══ */
.phone{width:360px;height:780px;background:#fff;border-radius:38px;position:relative;flex:none;
  box-shadow:0 0 0 5px #26222F,0 0 0 6px #3A3548,0 26px 60px rgba(40,30,90,.18);
  display:flex;flex-direction:column;overflow:hidden}
.notch{position:absolute;top:13px;left:50%;transform:translateX(-50%);width:11px;height:11px;background:#17151F;border-radius:50%;z-index:30}
.statusbar{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:12px;font-weight:700;color:#17151F}
.statusbar .ic{display:flex;gap:5px;align-items:center}
.apphead{flex:none;padding:18px 18px 20px 26px;display:flex;align-items:center;gap:9px}
.apphead .nm{font-size:23px;font-weight:700;color:#17151F;letter-spacing:-.02em}
.apphead .nm span{background:linear-gradient(90deg,#8B6CF6,#2EC9A0);-webkit-background-clip:text;background-clip:text;color:transparent}

.chat{flex:1;overflow-y:auto;padding:16px 14px 8px;scroll-behavior:smooth}
.chat::-webkit-scrollbar{width:0}

/* ── 빈 상태 ── */
.empty{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:70px}
.empty .mark{width:58px;height:58px;margin-bottom:19px}
.empty h2{font-size:19px;font-weight:800;color:#17151F;letter-spacing:-.03em;line-height:1.4;text-align:center}
.empty p{font-size:13.5px;font-weight:500;color:#8B84A8;line-height:1.6;text-align:center;margin-top:7px}

/* ── 버블 ── */
.me{display:flex;justify-content:flex-end;margin-bottom:16px}
.me .b{max-width:86%;background:#6D4FE0;color:#fff;font-size:13.5px;font-weight:600;line-height:1.5;
  letter-spacing:-.015em;padding:11px 14px;border-radius:17px 17px 5px 17px}
.me .attimg img{height:100%;width:auto;max-width:100%;border-radius:9px;object-fit:cover;display:block}
.me .attimg{margin-top:7px;height:84px;border-radius:9px;background:linear-gradient(145deg,rgba(255,255,255,.34),rgba(255,255,255,.14));
  display:flex;align-items:center;justify-content:center;gap:6px;font-size:10.5px;font-weight:700;color:#fff}

/* ── 단계 ── */
.step{display:flex;gap:10px;margin-bottom:17px}
.step .dot{width:7px;height:7px;border-radius:50%;flex:none;margin-top:8px;background:#C9BCF7}
.step .dot.live{background:#6D4FE0;animation:blink 1s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.step .body{flex:1;min-width:0}
.step .t{font-size:17px;font-weight:800;color:#17151F;letter-spacing:-.025em;line-height:1.45}
.hop{display:inline-flex;gap:4px;margin-left:7px;vertical-align:3px}
.hop i{width:5px;height:5px;border-radius:50%;background:#6D4FE0;animation:hop .95s ease-in-out infinite}
.hop i:nth-child(2){animation-delay:.16s}
.hop i:nth-child(3){animation-delay:.32s}
@keyframes hop{0%,62%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-5px);opacity:1}}
.step .d{font-size:14.5px;font-weight:500;color:#8B84A8;line-height:1.55;margin-top:5px}
.step .d b{color:#39354A;font-weight:700}
.step .d i{font-style:normal;color:#C4BED6;font-weight:600;margin-right:1px}
.answer{border:1px solid #DCD2FA;background:#F8F6FF;border-radius:13px;padding:13px 15px;margin-bottom:11px}
.answer .lbl{font-size:11.5px;font-weight:800;color:#9A8FC4;letter-spacing:.03em}
.answer .val{font-size:24px;font-weight:800;color:#17151F;letter-spacing:-.035em;line-height:1.25;margin-top:4px}
.answer .sub{font-size:12px;font-weight:600;color:#6C6680;line-height:1.5;margin-top:5px}

/* 한 줄씩 차례로 나타난다 */
.rv{opacity:0;transform:translateY(4px);transition:opacity .3s,transform .3s}
.rv.on{opacity:1;transform:none}

.stores{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 14px}
.srow{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:#8B84A8}
.srow.on{color:#39354A}
.srow .ck{width:13px;height:13px;border-radius:50%;flex:none;border:1.5px solid #D9D3E8;position:relative;transition:.25s}
.srow.on .ck{background:#17151F;border-color:#17151F}
.srow.on .ck::after{content:"";position:absolute;left:50%;top:50%;width:3px;height:5px;border:solid #fff;border-width:0 1.5px 1.5px 0;transform:translate(-50%,-70%) rotate(45deg)}

.narrow{margin-top:5px;display:flex;align-items:baseline;gap:5px;font-size:14px;font-weight:600;color:#8B84A8}
.narrow .big{font-size:17px;font-weight:800;color:#39354A;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.narrow .hit{color:#6D4FE0}

/* 웹에서 가져온 사실 */
.facts{margin-top:5px;display:flex;flex-direction:column;gap:2px}
.facts .f{display:flex;gap:8px;font-size:14px;font-weight:600;color:#39354A;line-height:1.5}
.facts .f i{font-style:normal;color:#B5AEC8;font-weight:600;flex:none;width:44px}

/* 되묻기 */
.ask{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.ask button{font-family:inherit;text-align:left;font-size:13px;font-weight:700;color:#39354A;background:#fff;
  border:1px solid #DCD6EC;border-radius:10px;padding:11px 13px;cursor:pointer;transition:.15s;line-height:1.4}
.ask button:hover{border-color:#6D4FE0;background:#F9F8FD;color:#6D4FE0}

/* ── 결과 ── */
.reshead{display:flex;align-items:baseline;gap:6px;margin:3px 0 10px 1px}
.reshead .t{font-size:15px;font-weight:800;color:#17151F;letter-spacing:-.025em}
.reshead .t b{color:#6D4FE0}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.card{border-radius:10px;overflow:hidden;background:#fff;border:1px solid #EFEBF9;cursor:pointer;transition:.18s}
.card:hover{border-color:#C9BCF7;box-shadow:0 6px 18px rgba(109,79,224,.13);transform:translateY(-1px)}
.thumb{position:relative;aspect-ratio:1/1;background:linear-gradient(145deg,#EDE9FA,#DFF4EE);display:flex;align-items:center;justify-content:center}
.thumb .badge{position:absolute;top:5px;left:5px;font-size:8.5px;font-weight:800;color:#fff;background:rgba(23,21,31,.62);padding:2.5px 5px;border-radius:4px}

/* 문서 결과 리스트 */
.list{display:flex;flex-direction:column;gap:7px}
.doc{display:flex;gap:10px;align-items:flex-start;border:1px solid #EFEBF9;border-radius:12px;padding:10px 11px;background:#fff;cursor:pointer;transition:.18s}
.doc:hover{border-color:#C9BCF7;box-shadow:0 6px 18px rgba(109,79,224,.13)}
.ext{width:34px;height:40px;flex:none;border-radius:6px;display:flex;align-items:flex-end;justify-content:center;
  padding-bottom:5px;font-size:8.5px;font-weight:800;color:#fff;letter-spacing:-.02em}
.ext.pdf{background:linear-gradient(160deg,#F2707A,#DC3B47)}
.ext.xlsx{background:linear-gradient(160deg,#4FCCA4,#12916F)}
.ext.pptx{background:linear-gradient(160deg,#F0A24E,#D2761A)}
.ext.docx{background:linear-gradient(160deg,#7E8AD4,#3F4C9E)}
.ext.png{background:linear-gradient(160deg,#9B8BEA,#6D4FE0)}
.doc .pv{width:34px;height:40px;flex:none;border-radius:6px;overflow:hidden;position:relative;
  border:1px solid #EAE5F7;background:#F6F4FC}
.doc .pv img{width:100%;height:100%;object-fit:cover;object-position:top}
.doc .pv .tag{position:absolute;left:0;right:0;bottom:0;background:#6D4FE0;font-size:7px;font-weight:800;
  color:#fff;text-align:center;padding:1.5px 0;letter-spacing:-.01em}
.doc .dm{flex:1;min-width:0}
.doc .fn{font-size:11.5px;font-weight:800;color:#17151F;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc .why{font-size:10.5px;font-weight:600;color:#6C6680;line-height:1.45;margin-top:3px}
.doc .why em{font-style:normal;font-weight:800;color:#6D4FE0;background:#F3F0FD;padding:1px 4px;border-radius:4px}
.doc .src{font-size:9.5px;font-weight:700;color:#B5AEC8;margin-top:4px;display:flex;gap:6px}

.follow{margin-top:13px;display:flex;flex-wrap:wrap;gap:6px}
.follow button{font-family:inherit;font-size:11.5px;font-weight:700;color:#6D4FE0;background:#F6F4FC;
  border:1px solid #EAE5F7;padding:7px 11px;border-radius:999px;cursor:pointer;transition:.15s}
.follow button:hover{background:#EFEAFE;border-color:#C9BCF7}

/* ── 입력창 ── */
.inputbar{flex:none;padding:10px 12px 16px;background:#fff}
.ibox{display:flex;align-items:center;gap:8px;background:#F6F4FC;border:1px solid #EAE5F7;border-radius:999px;padding:6px 6px 6px 16px}
.ibox input{flex:1;min-width:0;border:0;background:none;outline:none;font-family:inherit;font-size:13.5px;font-weight:600;color:#17151F;letter-spacing:-.02em;padding:6px 0}
.ibox input::placeholder{color:#B5AEC8;font-weight:500}
.send{width:34px;height:34px;flex:none;border:0;border-radius:50%;background:#6D4FE0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.send:hover{background:#5B3FD0}
.send:disabled{background:#DCD6EC;cursor:default}

.fade{opacity:0;transform:translateY(7px);animation:fade .42s cubic-bezier(.25,.8,.3,1) forwards}
@keyframes fade{to{opacity:1;transform:none}}

@media(max-width:820px){
  body{flex-direction:column;align-items:center;gap:22px;padding:26px 16px}
  .phone{order:1}
  .aside{order:2;width:100%;max-width:360px}
}
/* 이벤트별 결과 그룹 */
.clusters{display:flex;flex-direction:column;gap:16px}
.result-cluster{padding:10px;border:1px solid #E7E1F3;border-radius:12px;background:#FCFBFE}
.cluster-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.cluster-head h3{font-size:14px;font-weight:800;color:#39354A;letter-spacing:-.025em}
.cluster-head p{font-size:10.5px;color:#8B84A8;margin-top:4px;line-height:1.5}
.cluster-count{flex:none;border-radius:999px;background:#EEE8FC;color:#6D4FE0;font-size:11px;font-weight:800;padding:5px 8px}

.demo-detail{margin:auto;width:min(680px,calc(100vw - 32px));max-height:85vh;border:1px solid #E7E1F3;border-radius:18px;padding:0;color:#39354A;background:#fff;font-family:inherit;box-shadow:0 24px 90px #26222F33}
.demo-detail::backdrop{background:#26222F88}.detail-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 20px;border-bottom:1px solid #EFEBF9}.detail-head h2{font-size:17px;overflow-wrap:anywhere}.detail-head button{border:0;background:#F3F0FD;border-radius:50%;width:32px;height:32px;flex:none;font-size:22px;cursor:pointer;color:#6D4FE0}.detail-body{padding:20px;overflow:auto;max-height:calc(85vh - 70px);font-size:14px;line-height:1.7}.detail-body p{margin-bottom:14px}.detail-image{display:block;width:100%;max-height:460px;object-fit:contain;border-radius:10px;margin:12px 0 20px}.detail-link,.folder-files a{color:#6D4FE0}.folder-files{display:flex;flex-direction:column;gap:12px;overflow-wrap:anywhere}.detail-body blockquote{padding:16px;background:#F6F4FC;border-radius:12px}.result-notice{font-size:13px;line-height:1.6;color:#6D4FE0;background:#F6F4FC;border-radius:10px;padding:10px 12px;margin-bottom:14px}.card:focus-visible,.doc:focus-visible{outline:2px solid #6D4FE0;outline-offset:3px}
</style>
</head>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   합성데이터 연결 지점 — 아래 SCENARIOS 배열만 갈아끼우면 됩니다.
   제안서 05장 “사람은 보면 아는데, 지금 검색은 못 찾는 것들” 질의 8개.

   results[].src  실제 이미지 경로를 넣으면 플레이스홀더 대신 사진이 렌더됩니다.
   steps[].type   cond(찾을 내용 정리) · stores(저장소 목록) · narrow(범위 좁히기)
                  · note(설명 한 줄) · facts(밖에서 알아낸 정보) · ask(되묻기)
   ═══════════════════════════════════════════════════════════════════════ */
const STORES_ALL = [["갤러리","12,480"],["파일","3,210"],["카카오톡 받은 파일","1,940"],
                    ["메일 첨부","860"],["인스타그램","2,130"],["페이스북","510"]];
const STORES_DOC = [["파일","3,210"],["메일 첨부","860"],["카카오톡 받은 파일","1,940"]];

const SCENARIOS = [
{
  q:"창밖으로 바다가 보이는 카페에서 찍은 사진", layout:"grid", core:"장면의 구성을 읽는다",
  steps:[
    {type:"cond", t:"찾을 내용을 정리했어요",
     tags:[["대상","카페에서 찍은 사진"],["장면","창밖으로 바다가 보이는 구도"]]},
    {type:"stores", t:"사진이 있는 곳을 모두 찾아봤어요", rows:STORES_ALL},
    {type:"narrow", t:"카페에서 찍은 사진을 모았어요", from:"2,481", to:"24", unit:"장"},
    {type:"note", t:"한 장씩 확인했어요", hop:true, wait:1400,
     d:"창이 보이는지, <b>창밖이 바다인지</b> 확인했어요"},
    {type:"note", t:"세 번 다녀오셨네요",
     d:"<b>2022년 6월</b> · <b>2024년 7월</b> · <b>2026년 9월</b>, 서로 다른 카페예요"}
  ],
  results:[
    {file:"IMG_012216.jpg", store:"갤러리", date:"2026.09.05", why:"아치 창 너머 노을 진 바다", src:"01_cafe_photo/IMG_012216.jpg"},
    {file:"IMG_012218.jpg", store:"갤러리", date:"2026.09.05", why:"같은 자리 · 창밖 주황빛 바다", src:"01_cafe_photo/IMG_012218.jpg"},
    {file:"IMG_007452.jpg", store:"갤러리", date:"2024.07.19", why:"빗방울 맺힌 창 너머 회색 바다", src:"01_cafe_photo/IMG_007452.jpg"},
    {file:"IMG_007457.jpg", store:"카카오톡", date:"2024.07.19", why:"창가 좌석 · 비 내리는 바다", src:"01_cafe_photo/IMG_007457.jpg"},
    {file:"IMG_002934.jpg", store:"갤러리", date:"2022.06.14", why:"흰 창틀 너머 푸른 바다", src:"01_cafe_photo/IMG_002934.jpg"},
    {file:"IMG_002938.jpg", store:"인스타그램", date:"2022.06.14", why:"테이블 너머 창밖 바다", src:"01_cafe_photo/IMG_002938.jpg"},
    {file:"IMG_002941.jpg", store:"갤러리", date:"2022.06.14", why:"창가 테이블 · 햇빛 비치는 바다", src:"01_cafe_photo/IMG_002941.jpg"},
    {file:"IMG_007454.jpg", store:"갤러리", date:"2024.07.19", why:"같은 카페 · 창은 안 보임", src:"01_cafe_photo/IMG_007454.jpg", sub:true},
    {file:"IMG_002935.jpg", store:"페이스북", date:"2022.06.14", why:"같은 방문 · 실내 쪽", src:"01_cafe_photo/IMG_002935.jpg", sub:true},
    {file:"IMG_002937.jpg", store:"갤러리", date:"2022.06.14", why:"같은 방문 · 테이블 클로즈업", src:"01_cafe_photo/IMG_002937.jpg", sub:true}
  ],
  follow:["올해 것만 보기","이 카페 이름 알려줘","창밖이 보이는 것만"]
},
{

    {type:"narrow", t:"PDF와 일치하는 원본을 찾지 못했어요",
     from:"96", to:"0", unit:"건"}
  ],
  results:[],
  notice:"원본 PPT를 찾지 못했어요. 삭제한 파일이라면 휴지통에서 찾아볼 수 있어요.",
  trashResults:[
    {ext:"pptx", file:"브랜드전략_제안_v7.pptx", store:"PC", date:"2026.09.23 18:42",
     why:"<em>가장 유력한 원본</em> · 4쪽 내용이 PDF와 일치 · PDF 공유 전 수정", thumb:"08_brand_documents/브랜드전략_제안_v7.png"},
    {ext:"pptx", file:"브랜드전략_제안_v6.pptx", store:"모바일", date:"2026.09.20 16:10",
     why:"이전 버전 · 같은 4쪽이지만 <b>핵심 메시지와 실행 일정이 다름</b>", thumb:"08_brand_documents/브랜드전략_제안_v6.png"},
    {ext:"pdf", file:"브랜드전략_제안.pdf", store:"메일함", date:"2026.09.24 09:12",
     why:"대조용 PDF 사본 · 삭제된 메일의 첨부파일", thumb:"08_brand_documents/브랜드전략_제안.png"}
  ],
  follow:["v7만 열기","v6와 달라진 점"]
},
{
  q:"어제 회의 자료 표지에 쓴 제목 폰트와 커버 이미지", layout:"grid", core:"자료 안에 쓴 것을 꺼낸다",
  steps:[
    {type:"cond", t:"찾을 내용을 정리했어요",
     tags:[["자료","어제 회의 자료"],["찾을 것","표지 제목 폰트 · 커버 이미지"]]},
    {type:"stores", t:"문서가 있는 곳을 찾아봤어요", rows:STORES_DOC},
    {type:"note", t:"어제 만든 자료는 하나였어요",
     d:"<b>2026.10.18</b> 주거 경험 기획 회의 · 2027_주거경험_트렌드.pptx"},
    {type:"note", t:"파일 안을 열어봤어요", hop:true, wait:1600,
     d:"표지 슬라이드에서 <b>글꼴 지정과 이미지</b>를 꺼냈어요"}
  ],
  answer:{label:"표지 제목 폰트", value:"Noto Sans KR", sub:"45pt · 문서 기본 글꼴은 Aptos인데 표지 제목만 따로 지정했어요"},
  results:[
    {file:"IMG_013402.png", store:"파일", date:"2026.10.18", why:"표지에 깔린 커버 이미지 · 1672×941",
     src:"09_interior_trend_documents/IMG_013402.png"}
  ],
  follow:["이 자료 어떤 내용이야","같은 글꼴 쓴 자료 더 보기"]
}
];


/* 견적서는 기본적으로 최신 날짜부터 제공한다. */
SCENARIOS.find(s=>s.q==="견적 금액 500만 원 넘는 견적서").results.sort((a,b)=>b.date.localeCompare(a.date));

const U = path => encodeURI(path);   /* 한글 · 공백이 든 실제 파일 경로 */
const ICON_PHOTO = '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#6D4FE0" stroke-width="1.6" opacity=".3"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="m3 16.5 4.5-4 4 3.5 4-5 4.5 5.5"/></svg>';

const chat=document.getElementById('chat'), inp=document.getElementById('inp'),
      send=document.getElementById('send'), qpick=document.getElementById('qpick');
window.name='aidict-demo';                  /* 제안서에서 이 탭을 다시 쓰도록 이름을 붙인다 */
let timers=[], busy=false;

const wait=(ms,fn)=>timers.push(setTimeout(fn,ms));
const add=html=>{const d=document.createElement('div');d.className='fade';d.innerHTML=html;
                 chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d;};

/* 왼쪽 패널 — 제안서 05장 질의 8개 (폰 밖 데모 조작부) */
qpick.innerHTML=SCENARIOS.map((s,i)=>
  '<button data-i="'+i+'"><span class="n">'+(i+1)+'</span><span class="q">'+s.q+'</span>'
  +(s.attach?'<span class="att">사진 첨부</span>':'')
  +'<span class="core">'+s.core+'</span></button>').join('');
qpick.querySelectorAll('button').forEach(b=>b.onclick=()=>{
  reset();
  qpick.querySelectorAll('button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  typeQuery(SCENARIOS[+b.dataset.i].q);
});

function reset(){
  SCENARIOS.forEach(s=>delete s.usedFollow);
  activeScenario=null;
  timers.forEach(clearTimeout); timers=[]; busy=false;
  inp.value=''; inp.readOnly=false; inp.disabled=false; send.disabled=false;
  chat.innerHTML='<div class="empty">'
    +'<svg class="mark" viewBox="0 0 48 48" fill="none">'            /* 펼친 사전 + 돋보기 */
    +'<g stroke="#6D4FE0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity=".5">'
    +'<path d="M5 12c5.5-3 11.5-3 19 1v23c-7.5-4-13.5-4-19-1V12z"/>'
    +'<path d="M43 12c-5.5-3-11.5-3-19 1v23c7.5-4 13.5-4 19-1V12z"/></g>'
    +'<g stroke="#fff" stroke-width="6.5" stroke-linecap="round">'
    +'<circle cx="31" cy="30" r="8.5"/><path d="M37.2 36.2 43 42"/></g>'
    +'<g stroke="#6D4FE0" stroke-width="2.6" stroke-linecap="round">'
    +'<circle cx="31" cy="30" r="8.5"/><path d="M37.2 36.2 43 42"/></g></svg>'
    +'<h2>기억나는 대로 말해보세요</h2><p>알아서 찾아드려요</p></div>';
  qpick.querySelectorAll('button').forEach(x=>x.classList.remove('on'));
}

function typeQuery(q){
  inp.value=''; inp.readOnly=true; send.disabled=true;
  inp.focus();
  let i=0;
  (function tick(){
    if(i<=q.length){
      inp.value=q.slice(0,i++);
      inp.scrollLeft=inp.scrollWidth;
      wait(45,tick);
    } else wait(900,()=>{inp.readOnly=false; run();});
  })();
}

function run(){
  const q=inp.value.trim(); if(!q||busy||inp.readOnly) return;
  if(activeScenario && [...availableFollow(activeScenario),...(activeScenario.origin?['이전 결과로 돌아가기']:[])].includes(q)){
    inp.value='';
    const latest=chat.querySelector('[data-results="current"]');
    if(latest){
      const chip=[...latest.querySelectorAll('[data-follow]')].find(button=>button.dataset.follow===q);
      if(chip)chip.click();
      else applyFollow(activeScenario,q,latest);
    }
    return;
  }
  const exact=SCENARIOS.find(s=>s.q===q);
  const keywords=[['카페','바다'],['신발'],['견적'],['회의','자료'],['디올'],['와인'],['합격','파티'],['PDF','PPT']];
  const S=exact||SCENARIOS.find((s,i)=>keywords[i].every(word=>q.toLowerCase().includes(word.toLowerCase())));
  if(!S){
    add('<div class="me"><div class="b">'+h(q)+'</div></div>');
    chat.querySelectorAll('[data-results="current"]').forEach(el=>el.removeAttribute('data-results'));
    results({q,layout:'grid',results:[],follow:[],notice:'이 검색어에 해당하는 준비된 결과가 없어요. 사진 속 장면이나 파일의 내용, 날짜를 함께 적어주시면 좋아요.'});
    inp.value=''; send.disabled=false;return;
  }
  busy=true; inp.disabled=true; send.disabled=true;
  chat.innerHTML=''; inp.value='';

  add('<div class="me"><div class="b">'+h(q)
    +(S.attach?'<div class="attimg">'+(S.attachSrc
        ? '<img src="'+U(S.attachSrc)+'" alt="">'
        : ICON_PHOTO.replace(/#6D4FE0/g,'#fff').replace('opacity=".3"','opacity=".85"').replace(/30"/g,'22"')+S.attach)+'</div>':'')
    +'</div></div>');

  wait(420, ()=>step(S,0,1));
}

/* 단계 하나를 그리고, 다음 단계까지 걸릴 시간을 반환 */
function step(S,i,no){
  chat.querySelectorAll('.dot.live').forEach(d=>d.classList.remove('live'));
  chat.querySelectorAll('.hop').forEach(h=>h.remove());   /* 검색이 끝나면 도트를 멈춘다 */
  if(i>=S.steps.length){ results(S); return; }
  const s=S.steps[i]; let inner='';

  if(s.type==='cond')
    inner='<div class="d rv">'+s.tags.map(t=>'<i>'+t[0]+'</i> '+(t[2]?'<b>'+t[1]+'</b>':t[1])).join(' · ')+'</div>';
  else if(s.type==='stores')
    inner='<div class="stores">'+s.rows.map(r=>'<div class="srow rv"><span class="ck"></span><span>'+r[0]+'</span></div>').join('')+'</div>';
  else if(s.type==='narrow')
    inner='<div class="narrow rv"><span class="big">'+s.from+'</span><span>'+s.unit+'</span>'
      +'<span>→</span><span class="big hit">'+s.to+'</span><span>'+s.unit+'</span></div>';
  else if(s.type==='note') inner='<div class="d rv">'+s.d+'</div>';
  else if(s.type==='facts')
    inner='<div class="facts">'+s.facts.map(f=>'<div class="f rv"><i>'+f[0]+'</i><span>'+f[1]+'</span></div>').join('')+'</div>';
  else if(s.type==='ask')
    inner='<div class="d rv">'+s.d+'</div><div class="ask">'
      +s.opts.map((o,k)=>'<button class="rv" data-k="'+k+'">'+o[0]+'</button>').join('')+'</div>';

  const el=add('<div class="step"><div class="dot live"></div>'
    +'<div class="body"><div class="t">'+s.t
    +(s.hop?'<span class="hop"><i></i><i></i><i></i></span>':'')+'</div>'+inner+'</div></div>');

  /* 한 줄씩 차례로 띄워 처리 중인 느낌을 낸다 */
  const rows=[...el.querySelectorAll('.rv')];
  const lag=s.wait||0;                       /* 도트만 도는 구간 */
  rows.forEach((n,k)=>wait(lag+260+k*230,()=>{n.classList.add('on');chat.scrollTop=chat.scrollHeight;}));
  const dur=700+rows.length*230+lag;

  if(s.type==='ask'){                        /* 사용자가 고를 때까지 멈춤 */
    if(s.hop) wait(lag+260+rows.length*230,()=>el.querySelectorAll('.hop').forEach(h=>h.remove()));
    el.querySelectorAll('.ask button').forEach(b=>b.onclick=()=>{
      const o=s.opts[+b.dataset.k];
      el.querySelector('.ask').remove();
      el.querySelector('.d').innerHTML='선택: <b>'+o[0]+'</b>';
      add('<div class="me"><div class="b">'+o[0]+'</div></div>');
      /* 고른 선택지에 따라 이후 단계와 결과가 달라진다 */
      const N=o[2] ? Object.assign({},S,{steps:S.steps.slice(0,i+1).concat(o[2].steps),
                                         results:o[2].results, follow:o[2].follow||S.follow}) : S;
      wait(420,()=>step(N,i+1,no+1));
    });
    chat.scrollTop=chat.scrollHeight;
    return;
  }
  wait(dur,()=>step(S,i+1,no+1));
}

function results(S, grouped=false, existing=null){
  let body;
  if(S.layout==='grid'){
    const renderGrid=items=>'<div class="grid">'+items.map(r=>
      '<div class="card" role="button" tabindex="0" aria-label="'+h(r.file)+'" data-file="'+r.file+'"><div class="thumb">'
      +(r.src?'<img src="'+U(r.src)+'" alt="" loading="lazy" style="width:100%;height:100%;object-fit:cover">':ICON_PHOTO)
      +'<span class="badge">'+(r.inTrash?'휴지통 · ':'')+r.store+'</span></div></div>').join('')+'</div>';
    body=grouped && S.clusters
      ? '<div class="clusters">'+S.clusters.map(group=>{
          const items=S.results.filter(r=>r.date.slice(0,10)===group.date);
          return '<section class="result-cluster" aria-label="'+group.title+'">'
            +'<div class="cluster-head"><div><h3>'+group.title+'</h3><p>'+group.date+' · '+group.description+'</p></div>'
            +'<span class="cluster-count">'+items.length+'장</span></div>'+renderGrid(items)+'</section>';
        }).join('')+'</div>'
      : renderGrid(S.results);
  } else {
    body='<div class="list">'+S.results.map(r=>
      '<div class="doc" role="button" tabindex="0" aria-label="'+h(r.file)+'" data-file="'+r.file+'">'
      +(r.shot
        ? '<div class="pv"><img src="'+U(r.thumb)+'" alt="" loading="lazy"><span class="tag">'+r.ext.toUpperCase()+'</span></div>'
        : '<div class="ext '+r.ext+'">'+r.ext.toUpperCase()+'</div>')
      +'<div class="dm"><div class="fn">'+r.file+'</div><div class="why">'+r.why+'</div>'
      +'<div class="src"><span>'+(r.inTrash?'휴지통 · ':'')+r.store+'</span><span>'+r.date+'</span></div></div></div>').join('')+'</div>';
  }
  const answer=S.answer?'<div class="answer"><div class="lbl">'+h(S.answer.label)+'</div>'
    +'<div class="val">'+h(S.answer.value)+'</div><div class="sub">'+h(S.answer.sub)+'</div></div>':'';
  const html='<div data-results="current">'+answer+'<div class="reshead"><div class="t"><b>'+S.results.length+(S.layout==='grid'?'장':'건')+'</b> 찾았어요'
    +(grouped && S.clusters?' · '+S.clusters.length+'개 그룹':'')+'</div></div>'+(S.notice?'<div class="result-notice">'+h(S.notice)+'</div>':'')+body
    +'<div class="follow">'
    +(S.clusters?'<button data-action="group-results">'+(grouped?'한데 모아 보기':'이벤트별로 나눠 보기')+'</button>':'')
    +(S.origin?'<button data-follow="이전 결과로 돌아가기">이전 결과로 돌아가기</button>':'')
    +availableFollow(S).map(f=>'<button data-follow="'+h(f)+'">'+f+'</button>').join('')+'</div></div>';
  const result=existing || add(html);
  if(existing) result.innerHTML=html;
  const groupChip=result.querySelector('[data-action="group-results"]');
  if(groupChip) groupChip.onclick=()=>results(S,!grouped,result);
  activeScenario=S;
  result.querySelectorAll('[data-follow]').forEach(button=>button.onclick=()=>{
    if(busy) return;
    const label=button.dataset.follow;
    button.remove();
    applyFollow(S,label,result);
  });
  result.querySelectorAll('.card,.doc').forEach(card=>{
    const open=()=>{if(!busy)previewFile(S.results.find(r=>r.file===card.dataset.file));};
    card.onclick=open;
    card.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open();}};
  });
  inp.disabled=false; send.disabled=false; busy=false;
  if(existing){
    chat.scrollTop+=result.getBoundingClientRect().top-chat.getBoundingClientRect().top-24;
  } else chat.scrollTop=chat.scrollHeight;
}

inp.addEventListener('keydown',e=>{if(e.key==='Enter') run();});
reset();
</script>
</body>
</html>
