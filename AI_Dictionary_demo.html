<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI ( ) Dictionary — 데모</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Pretendard Variable',Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  background:#17151F;color:#39354A;word-break:keep-all;-webkit-font-smoothing:antialiased;
  min-height:100vh;display:flex;align-items:center;justify-content:center;gap:52px;padding:40px 24px;flex-wrap:wrap}

.aside{width:300px;display:flex;flex-direction:column;gap:13px}
.aside .brand{font-size:12px;font-weight:800;letter-spacing:.1em;color:#8B6CF6}
.qpick{display:flex;flex-direction:column;gap:6px}
.qpick button{font-family:inherit;text-align:left;display:flex;gap:9px;align-items:center;width:100%;
  background:#211E2C;border:1px solid #302B40;border-radius:10px;padding:10px 12px;cursor:pointer;transition:.15s}
.qpick button:hover{background:#2A2539;border-color:#6D4FE0}
.qpick button.on{background:#2C2440;border-color:#6D4FE0}
.qpick .n{width:17px;height:17px;flex:none;border-radius:5px;background:#332B4E;color:#A98CF8;
  font-size:9.5px;font-weight:800;display:flex;align-items:center;justify-content:center}
.qpick .q{font-size:12px;font-weight:700;color:#BDB5D2;letter-spacing:-.02em;line-height:1.35}
.qpick button:hover .q,.qpick button.on .q{color:#fff}
.qpick .att{font-size:8.5px;font-weight:800;color:#2EC9A0;background:#1B3730;padding:2px 5px;border-radius:4px;margin-left:auto;flex:none}
.replay{display:inline-flex;align-items:center;gap:7px;align-self:flex-start;border:1px solid #3B3650;background:#221F2E;
  color:#C9C2DC;font-family:inherit;font-size:12.5px;font-weight:700;padding:9px 15px;border-radius:999px;cursor:pointer;transition:.18s}
.replay:hover{background:#2C2840;border-color:#6D4FE0;color:#fff}

/* ══ 폰 360x780 ══ */
.phone{width:360px;height:780px;background:#fff;border-radius:38px;position:relative;flex:none;
  box-shadow:0 0 0 9px #26222F,0 0 0 10.5px #3A3548,0 30px 70px rgba(0,0,0,.6);
  display:flex;flex-direction:column;overflow:hidden}
.notch{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:104px;height:26px;background:#17151F;border-radius:999px;z-index:30}
.statusbar{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:12px;font-weight:700;color:#17151F}
.statusbar .ic{display:flex;gap:5px;align-items:center}
.apphead{flex:none;padding:4px 18px 12px;display:flex;align-items:center;gap:9px;border-bottom:1px solid #F0EDF7}
.logo{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#8B6CF6,#2EC9A0);flex:none}
.apphead .nm{font-size:14.5px;font-weight:800;color:#17151F;letter-spacing:-.02em}
.apphead .nm span{background:linear-gradient(90deg,#8B6CF6,#2EC9A0);-webkit-background-clip:text;background-clip:text;color:transparent}

.chat{flex:1;overflow-y:auto;padding:16px 14px 8px;scroll-behavior:smooth}
.chat::-webkit-scrollbar{width:0}

/* ── 빈 상태 ── */
.empty{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:70px}
.empty .mark{width:54px;height:54px;border-radius:19px;background:linear-gradient(135deg,#8B6CF6,#2EC9A0);opacity:.15;margin-bottom:19px}
.empty h2{font-size:19px;font-weight:800;color:#17151F;letter-spacing:-.03em;line-height:1.4;text-align:center}
.empty p{font-size:13.5px;font-weight:500;color:#8B84A8;line-height:1.6;text-align:center;margin-top:7px}

/* ── 버블 ── */
.me{display:flex;justify-content:flex-end;margin-bottom:16px}
.me .b{max-width:86%;background:#6D4FE0;color:#fff;font-size:13.5px;font-weight:600;line-height:1.5;
  letter-spacing:-.015em;padding:11px 14px;border-radius:17px 17px 5px 17px}
.me .attimg{margin-top:7px;height:64px;border-radius:9px;background:linear-gradient(145deg,rgba(255,255,255,.34),rgba(255,255,255,.14));
  display:flex;align-items:center;justify-content:center;gap:6px;font-size:10.5px;font-weight:700;color:#fff}

/* ── 단계 ── */
.step{display:flex;gap:9px;margin-bottom:11px}
.step .dot{width:22px;height:22px;border-radius:50%;flex:none;margin-top:1px;background:#EFEAFE;
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#6D4FE0}
.step .body{flex:1;min-width:0}
.step .t{font-size:12.5px;font-weight:800;color:#17151F;letter-spacing:-.015em;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.step .d{font-size:11.5px;font-weight:500;color:#6C6680;line-height:1.55;margin-top:3px}
.step .d b{color:#17151F;font-weight:800}


.cond{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.cond span{font-size:11px;font-weight:700;color:#39354A;background:#F6F4FC;border:1px solid #EAE5F7;padding:4px 8px;border-radius:7px}
.cond span i{font-style:normal;color:#9A93B0;font-weight:600;margin-right:4px}
.cond span.warn{background:#FDF3E3;border-color:#F4E3C4;color:#A8762A}

.stores{margin-top:8px;display:flex;flex-direction:column;gap:4px}
.srow{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;color:#8B84A8;opacity:.35;transition:opacity .25s}
.srow.on{opacity:1;color:#39354A}
.srow .ck{width:13px;height:13px;border-radius:50%;flex:none;border:1.5px solid #D9D3E8;position:relative;transition:.25s}
.srow.on .ck{background:#2EC9A0;border-color:#2EC9A0}
.srow.on .ck::after{content:"";position:absolute;left:3.6px;top:1.4px;width:3.2px;height:6.4px;border:solid #fff;border-width:0 1.6px 1.6px 0;transform:rotate(43deg)}
.srow .n{margin-left:auto;font-size:10.5px;font-weight:700;color:#B5AEC8;font-variant-numeric:tabular-nums}
.srow.on .n{color:#6C6680}

.narrow{margin-top:9px;background:#F9F8FD;border:1px solid #EFEBF9;border-radius:10px;padding:10px 11px}
.narrow .row{display:flex;align-items:baseline;gap:6px;font-size:11.5px;font-weight:700;color:#6C6680}
.narrow .big{font-size:17px;font-weight:800;color:#17151F;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.narrow .arw{color:#B5AEC8;font-weight:800}
.narrow .hit{color:#6D4FE0}
.bar{margin-top:7px;height:4px;border-radius:99px;background:#EAE5F7;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#8B6CF6,#2EC9A0);transition:width 1.1s cubic-bezier(.4,0,.2,1)}

/* 웹에서 가져온 사실 */
.facts{margin-top:8px;border:1px solid #F4E3C4;background:#FEFAF2;border-radius:10px;padding:9px 11px;display:flex;flex-direction:column;gap:5px}
.facts .f{display:flex;gap:8px;font-size:11px;font-weight:700;color:#17151F;line-height:1.4}
.facts .f i{font-style:normal;color:#A8762A;font-weight:700;flex:none;width:52px}

/* 되묻기 */
.ask{margin-top:7px;display:flex;flex-direction:column;gap:5px}
.ask button{font-family:inherit;text-align:left;font-size:11.5px;font-weight:700;color:#39354A;background:#fff;
  border:1px solid #DCD6EC;border-radius:9px;padding:8px 11px;cursor:pointer;transition:.15s;line-height:1.4}
.ask button:hover{border-color:#6D4FE0;background:#F9F8FD;color:#6D4FE0}
.ask button .sub{display:block;font-size:10px;font-weight:600;color:#9A93B0;margin-top:2px}

/* ── 결과 ── */
.reshead{display:flex;align-items:baseline;gap:6px;margin:3px 0 10px 1px}
.reshead .t{font-size:14.5px;font-weight:800;color:#17151F;letter-spacing:-.025em}
.reshead .t b{color:#6D4FE0}
.reshead .s{font-size:10.5px;font-weight:700;color:#B5AEC8;margin-left:auto}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.card{border-radius:13px;overflow:hidden;background:#fff;border:1px solid #EFEBF9;cursor:pointer;transition:.18s}
.card:hover{border-color:#C9BCF7;box-shadow:0 6px 18px rgba(109,79,224,.13);transform:translateY(-1px)}
.thumb{position:relative;aspect-ratio:1/1;background:linear-gradient(145deg,#EDE9FA,#DFF4EE);display:flex;align-items:center;justify-content:center}
.thumb .badge{position:absolute;top:6px;left:6px;font-size:9px;font-weight:800;color:#fff;background:rgba(23,21,31,.62);padding:3px 6px;border-radius:5px}
.thumb .date{position:absolute;bottom:6px;right:6px;font-size:9px;font-weight:700;color:#fff;background:rgba(23,21,31,.5);padding:2.5px 5px;border-radius:4px;font-variant-numeric:tabular-nums}
.card .meta{padding:8px 9px 9px}
.card .fn{font-size:10.5px;font-weight:800;color:#17151F;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .why{font-size:10px;font-weight:600;color:#8B84A8;line-height:1.45;margin-top:2px}

/* 문서 결과 리스트 */
.list{display:flex;flex-direction:column;gap:7px}
.doc{display:flex;gap:10px;align-items:flex-start;border:1px solid #EFEBF9;border-radius:12px;padding:10px 11px;background:#fff;cursor:pointer;transition:.18s}
.doc:hover{border-color:#C9BCF7;box-shadow:0 6px 18px rgba(109,79,224,.13)}
.ext{width:34px;height:40px;flex:none;border-radius:6px;display:flex;align-items:flex-end;justify-content:center;
  padding-bottom:5px;font-size:8.5px;font-weight:800;color:#fff;letter-spacing:-.02em}
.ext.pdf{background:linear-gradient(160deg,#F2707A,#DC3B47)}
.ext.xlsx{background:linear-gradient(160deg,#4FCCA4,#12916F)}
.ext.pptx{background:linear-gradient(160deg,#F0A24E,#D2761A)}
.ext.docx{background:linear-gradient(160deg,#7E8AD4,#3F4C9E)}
.doc .dm{flex:1;min-width:0}
.doc .fn{font-size:11.5px;font-weight:800;color:#17151F;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc .why{font-size:10.5px;font-weight:600;color:#6C6680;line-height:1.45;margin-top:3px}
.doc .why em{font-style:normal;font-weight:800;color:#6D4FE0;background:#F3F0FD;padding:1px 4px;border-radius:4px}
.doc .src{font-size:9.5px;font-weight:700;color:#B5AEC8;margin-top:4px;display:flex;gap:6px}

.follow{margin-top:13px;display:flex;flex-wrap:wrap;gap:6px}
.follow button{font-family:inherit;font-size:11.5px;font-weight:700;color:#6D4FE0;background:#F6F4FC;
  border:1px solid #EAE5F7;padding:7px 11px;border-radius:999px;cursor:pointer;transition:.15s}
.follow button:hover{background:#EFEAFE;border-color:#C9BCF7}

/* ── 입력창 ── */
.inputbar{flex:none;border-top:1px solid #F0EDF7;padding:10px 12px 16px;background:#fff}
.ibox{display:flex;align-items:center;gap:8px;background:#F6F4FC;border:1px solid #EAE5F7;border-radius:999px;padding:6px 6px 6px 16px}
.ibox input{flex:1;min-width:0;border:0;background:none;outline:none;font-family:inherit;font-size:13.5px;font-weight:600;color:#17151F;letter-spacing:-.02em;padding:6px 0}
.ibox input::placeholder{color:#B5AEC8;font-weight:500}
.send{width:34px;height:34px;flex:none;border:0;border-radius:50%;background:#6D4FE0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.send:hover{background:#5B3FD0}
.send:disabled{background:#DCD6EC;cursor:default}

.fade{opacity:0;transform:translateY(7px);animation:fade .42s cubic-bezier(.25,.8,.3,1) forwards}
@keyframes fade{to{opacity:1;transform:none}}

@media(max-width:820px){
  body{flex-direction:column;align-items:center;gap:22px;padding:26px 16px}
  .phone{order:1}
  .aside{order:2;width:100%;max-width:360px}
}
</style>
</head>
<body>

<div class="aside">
  <div class="brand">AI ( ) DICTIONARY</div>
  <div class="qpick" id="qpick"></div>
  <button class="replay" onclick="reset()">↻ 처음부터</button>
</div>

<div class="phone">
  <div class="notch"></div>
  <div class="statusbar">
    <span>9:41</span>
    <span class="ic">
      <svg width="16" height="11" viewBox="0 0 16 11" fill="#17151F"><rect y="7" width="3" height="4" rx="1"/><rect x="4.3" y="5" width="3" height="6" rx="1"/><rect x="8.6" y="2.5" width="3" height="8.5" rx="1"/><rect x="12.9" width="3" height="11" rx="1" opacity=".3"/></svg>
      <svg width="24" height="11" viewBox="0 0 24 11" fill="none"><rect x=".5" y=".5" width="20" height="10" rx="3" stroke="#17151F" stroke-opacity=".35"/><rect x="2" y="2" width="15" height="7" rx="1.8" fill="#17151F"/><path d="M22 4v3a2 2 0 0 0 0-3z" fill="#17151F" fill-opacity=".35"/></svg>
    </span>
  </div>

  <div class="apphead">
    <div class="logo"></div>
    <div class="nm">AI <span>(&nbsp;&nbsp;)</span> Dictionary</div>
  </div>

  <div class="chat" id="chat"></div>

  <div class="inputbar">
    <div class="ibox">
      <input id="inp" placeholder="무엇을 찾고 계세요?" autocomplete="off">
      <button class="send" id="send" onclick="run()">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M8 13.5V3M8 3 3.5 7.5M8 3l4.5 4.5" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   합성데이터 연결 지점 — 아래 SCENARIOS 배열만 갈아끼우면 됩니다.
   제안서 05장 “사람은 보면 아는데, 지금 검색은 못 찾는 것들” 질의 8개.

   results[].src  실제 이미지 경로를 넣으면 플레이스홀더 대신 사진이 렌더됩니다.
   steps[].type   cond(찾을 내용 정리) · stores(저장소 훑기) · narrow(추리기)
                  · note(설명 한 줄) · facts(밖에서 알아낸 정보) · ask(되묻기)
   ═══════════════════════════════════════════════════════════════════════ */
const STORES_ALL = [["갤러리","12,480"],["파일","3,210"],["카카오 받은 파일","1,940"],
                    ["메일 첨부","860"],["인스타그램","2,130"],["페이스북","510"]];
const STORES_DOC = [["파일","3,210"],["메일 첨부","860"],["카카오 받은 파일","1,940"]];

const SCENARIOS = [
{
  q:"창밖으로 바다가 보이는 카페에서 찍은 사진", layout:"grid",
  steps:[
    {type:"cond", t:"찾을 내용을 정리했어요",
     tags:[["대상","사진"],["장소","카페"],["창밖 풍경","바다"]]},
    {type:"stores", t:"사진이 있는 곳을 모두 찾아봤어요", rows:STORES_ALL},
    {type:"narrow", t:"카페에서 찍은 사진부터 추렸어요", from:"2,481", to:"24", unit:"장"},
    {type:"note", t:"한 장씩 확인했어요",
     d:"창이 보이는지, <b>창밖이 바다인지</b> 확인했어요"}
  ],
  results:[
    {file:"IMG_4820.HEIC", store:"갤러리", date:"2025.07.12", why:"창가 자리 · 통창 너머 수평선", src:null},
    {file:"IMG_3317.HEIC", store:"갤러리", date:"2024.09.28", why:"테라스 · 바다 정면", src:null},
    {file:"KakaoTalk_0912.jpg", store:"카카오", date:"2025.05.03", why:"창틀 안쪽 · 해안선", src:null},
    {file:"insta_saved_07.jpg", store:"인스타", date:"2023.08.19", why:"유리창 반사 · 바다 배경", src:null},
    {file:"IMG_2044.HEIC", store:"갤러리", date:"2023.06.02", why:"카페 내부 · 창밖 항구", src:null},
    {file:"photo_mail_12.jpg", store:"메일", date:"2022.10.15", why:"창측 좌석 · 먼바다", src:null}
  ],
  follow:["작년 것만 보기","세로 사진만","이 카페 이름 알려줘"]
},
{
  q:"이 신발 신고 찍은 사진", attach:"신발 사진 1장", layout:"grid",
  steps:[
    {type:"cond", t:"보내주신 사진을 기준으로 찾을게요",
     tags:[["기준","보내주신 사진"],["대상","사진"],["조건","같은 신발을 신은"]]},
    {type:"note", t:"사진에서 신발만 봤어요",
     d:"배경은 빼고 <b>신발 모양과 색</b>만 기억해뒀어요"},
    {type:"stores", t:"사람이 나온 사진을 모두 찾아봤어요", rows:STORES_ALL},
    {type:"narrow", t:"발이 보이는 사진부터 추렸어요", from:"1,840", to:"18", unit:"장"},
    {type:"note", t:"같은 신발이 맞는지 확인했어요",
     d:"색과 무늬까지 비교해서 <b>비슷한 다른 신발</b>은 걸러냈어요"}
  ],
  results:[
    {file:"IMG_5102.HEIC", store:"갤러리", date:"2025.04.06", why:"전신 · 같은 흰 스니커즈", src:null},
    {file:"IMG_4977.HEIC", store:"갤러리", date:"2025.03.22", why:"발끝만 보임 · 밑창 일치", src:null},
    {file:"insta_post_31.jpg", store:"인스타", date:"2024.11.09", why:"측면 · 로고 위치 일치", src:null},
    {file:"KakaoTalk_1177.jpg", store:"카카오", date:"2024.08.14", why:"단체 사진 · 오른쪽 끝", src:null},
    {file:"IMG_4410.HEIC", store:"갤러리", date:"2024.05.30", why:"계단 · 정면 클로즈업", src:null}
  ],
  follow:["산 날짜 · 영수증 찾기","가장 최근 것부터","같이 신은 옷 보기"]
},
{
  q:"견적 금액 500만 원 넘는 견적서", layout:"list",
  steps:[
    {type:"cond", t:"찾을 내용을 정리했어요",
     tags:[["대상","문서"],["종류","견적서"],["금액","500만 원 넘는"]]},
    {type:"stores", t:"문서가 있는 곳을 모두 찾아봤어요", rows:STORES_DOC},
    {type:"narrow", t:"견적서만 골라냈어요",
     d:"파일 이름이 아니라 <b>문서 안을 열어서</b> 확인했어요", from:"214", to:"38", unit:"건"},
    {type:"note", t:"금액을 확인했어요",
     d:"견적서마다 <b>합계 금액</b>을 읽고 500만 원과 비교했어요"}
  ],
  results:[
    {ext:"pdf",  file:"인테리어_견적서_최종.pdf", store:"메일 첨부", date:"2025.02.18", why:"합계 <em>8,420,000원</em> · 부가세 별도"},

const ICON_PHOTO = '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#6D4FE0" stroke-width="1.6" opacity=".3"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="m3 16.5 4.5-4 4 3.5 4-5 4.5 5.5"/></svg>';

const chat=document.getElementById('chat'), inp=document.getElementById('inp'),
      send=document.getElementById('send'), qpick=document.getElementById('qpick');
let timers=[], busy=false;

const wait=(ms,fn)=>timers.push(setTimeout(fn,ms));
const add=html=>{const d=document.createElement('div');d.className='fade';d.innerHTML=html;
                 chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d;};

/* 왼쪽 패널 — 제안서 05장 질의 8개 (폰 밖 데모 조작부) */
qpick.innerHTML=SCENARIOS.map((s,i)=>
  '<button data-i="'+i+'"><span class="n">'+(i+1)+'</span><span class="q">'+s.q+'</span>'
  +(s.attach?'<span class="att">사진 첨부</span>':'')+'</button>').join('');
qpick.querySelectorAll('button').forEach(b=>b.onclick=()=>{
  qpick.querySelectorAll('button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  typeQuery(SCENARIOS[+b.dataset.i].q);
});

function reset(){
  timers.forEach(clearTimeout); timers=[]; busy=false;
  inp.value=''; inp.disabled=false; send.disabled=false;
  chat.innerHTML='<div class="empty"><div class="mark"></div>'
    +'<h2>기억나는 대로 말해보세요</h2><p>알아서 찾아드려요</p></div>';
  qpick.querySelectorAll('button').forEach(x=>x.classList.remove('on'));
}

function typeQuery(q){
  if(busy) return;
  inp.value=''; let i=0;
  (function tick(){ if(i<=q.length){inp.value=q.slice(0,i++); wait(28,tick);} else wait(230,run); })();
}

function run(){
  const q=inp.value.trim(); if(!q||busy) return;
  busy=true; inp.disabled=true; send.disabled=true;
  const S=SCENARIOS.find(s=>s.q===q)||SCENARIOS[0];
  chat.innerHTML=''; inp.value='';

  add('<div class="me"><div class="b">'+q
    +(S.attach?'<div class="attimg">'+ICON_PHOTO.replace(/#6D4FE0/g,'#fff').replace('opacity=".3"','opacity=".85"').replace(/30"/g,'22"')+S.attach+'</div>':'')
    +'</div></div>');

  wait(420, ()=>step(S,0,1));
}

/* 단계 하나를 그리고, 다음 단계까지 걸릴 시간을 반환 */
function step(S,i,no){
  if(i>=S.steps.length){ results(S); return; }
  const s=S.steps[i]; let dur=1100, inner='';

  if(s.type==='cond'){
    inner='<div class="cond">'+s.tags.map(t=>'<span'+(t[2]?' class="warn"':'')+'><i>'+t[0]+'</i>'+t[1]+'</span>').join('')+'</div>';
    dur=900;
  }
  else if(s.type==='stores'){
    inner='<div class="stores">'+s.rows.map((r,k)=>'<div class="srow"><span class="ck"></span><span>'+r[0]+'</span><span class="n">'+r[1]+'</span></div>').join('')+'</div>';
    dur=380+s.rows.length*190;
  }
  else if(s.type==='narrow'){
    inner=(s.d?'<div class="d">'+s.d+'</div>':'')
      +'<div class="narrow"><div class="row"><span class="big">'+s.from+'</span><span>'+s.unit+'</span>'
      +'<span class="arw">→</span><span class="big hit">'+s.to+'</span><span>'+s.unit+'</span></div>'
      +'<div class="bar"><i></i></div></div>';
    dur=1350;
  }
  else if(s.type==='note'){ inner='<div class="d">'+s.d+'</div>'; dur=950; }
  else if(s.type==='facts'){
    inner='<div class="facts">'+s.facts.map(f=>'<div class="f"><i>'+f[0]+'</i><span>'+f[1]+'</span></div>').join('')+'</div>';
    dur=1250;
  }
  else if(s.type==='ask'){
    inner='<div class="d">'+s.d+'</div><div class="ask">'
      +s.opts.map((o,k)=>'<button data-k="'+k+'">'+o[0]+'<span class="sub">'+o[1]+'</span></button>').join('')+'</div>';
  }

  const el=add('<div class="step"><div class="dot">'+(s.type==='ask'?'?':no)+'</div>'
    +'<div class="body"><div class="t">'+s.t+'</div>'+inner+'</div></div>');

  if(s.type==='stores')
    el.querySelectorAll('.srow').forEach((r,k)=>wait(150+k*190,()=>{r.classList.add('on');chat.scrollTop=chat.scrollHeight;}));
  if(s.type==='narrow') wait(90,()=>el.querySelector('.bar i').style.width='100%');

  if(s.type==='ask'){                        /* 사용자가 고를 때까지 멈춤 */
    el.querySelectorAll('.ask button').forEach(b=>b.onclick=()=>{
      const o=s.opts[+b.dataset.k];
      el.querySelector('.ask').remove();
      el.querySelector('.d').innerHTML='선택: <b>'+o[0]+'</b>';
      add('<div class="me"><div class="b">'+o[0]+'</div></div>');
      wait(420,()=>step(S,i+1,no+1));
    });
    chat.scrollTop=chat.scrollHeight;
    return;
  }
  wait(dur,()=>step(S,i+1,no+1));
}

function results(S){
  let body;
  if(S.layout==='grid'){
    body='<div class="grid">'+S.results.map(r=>
      '<div class="card"><div class="thumb" data-file="'+r.file+'">'
      +(r.src?'<img src="'+r.src+'" alt="" style="width:100%;height:100%;object-fit:cover">':ICON_PHOTO)
      +'<span class="badge">'+r.store+'</span><span class="date">'+r.date+'</span></div>'
      +'<div class="meta"><div class="fn">'+r.file+'</div><div class="why">'+r.why+'</div></div></div>').join('')+'</div>';
  } else {
    body='<div class="list">'+S.results.map(r=>
      '<div class="doc" data-file="'+r.file+'"><div class="ext '+r.ext+'">'+r.ext.toUpperCase()+'</div>'
      +'<div class="dm"><div class="fn">'+r.file+'</div><div class="why">'+r.why+'</div>'
      +'<div class="src"><span>'+r.store+'</span><span>'+r.date+'</span></div></div></div>').join('')+'</div>';
  }
  add('<div><div class="reshead"><div class="t"><b>'+S.results.length+''+(S.layout==='grid'?'장':'건')+'</b> 찾았어요</div>'
    +'<div class="s">정확도순</div></div>'+body
    +'<div class="follow">'+S.follow.map(f=>'<button>'+f+'</button>').join('')+'</div></div>');
  inp.disabled=false; send.disabled=false; busy=false;
  chat.scrollTop=chat.scrollHeight;
}

inp.addEventListener('keydown',e=>{if(e.key==='Enter') run();});
reset();
